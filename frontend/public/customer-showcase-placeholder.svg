<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Vibrant Tech Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#057c56" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Orange Accent Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <circle cx="400" cy="380" r="360" fill="url(#centerGlow)" />

  <!-- Subtle Geometric Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="800" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="720" y1="0" x2="720" y2="800" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="540" x2="800" y2="540" />
    <line x1="0" y1="680" x2="800" y2="680" />
  </g>

  <!-- Central Storefront & Customer Delivery Illustration -->
  <g filter="url(#dropShadow)" transform="translate(400, 340)">
    <!-- Storefront Canopy / Awning -->
    <path d="M-180 -140 L180 -140 L210 -80 L-210 -80 Z" fill="#0284c7" />
    <!-- Awning Stripes -->
    <path d="M-180 -140 L-120 -140 L-140 -80 L-210 -80 Z" fill="#0369a1" />
    <path d="M-60 -140 L0 -140 L0 -80 L-70 -80 Z" fill="#0369a1" />
    <path d="M60 -140 L120 -140 L140 -80 L70 -80 Z" fill="#0369a1" />

    <!-- Main Display Showcase Window -->
    <rect x="-190" y="-80" width="380" height="230" rx="16" fill="#1e293b" stroke="#0284c7" stroke-width="3" />

    <!-- Monitor / All-in-One PC inside Store -->
    <rect x="-120" y="-45" width="240" height="135" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <rect x="-112" y="-37" width="224" height="119" rx="4" fill="#0284c7" opacity="0.15" />
    <!-- Screen graphic lines -->
    <path d="M-90 20 L-40 -15 L10 5 L60 -25 L85 0" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Monitor Stand -->
    <path d="M-20 90 L20 90 L30 120 L-30 120 Z" fill="#64748b" />
    <rect x="-45" y="120" width="90" height="8" rx="4" fill="#94a3b8" />

    <!-- Customer Delivery Gift / Laptop Box with Ribbon -->
    <g transform="translate(100, 60)">
      <rect x="-55" y="-35" width="110" height="70" rx="8" fill="url(#orangeGrad)" stroke="#ffffff" stroke-width="2" />
      <!-- Ribbon vertical & horizontal -->
      <rect x="-10" y="-35" width="20" height="70" fill="#ffffff" opacity="0.9" />
      <rect x="-55" y="-10" width="110" height="20" fill="#ffffff" opacity="0.9" />
      <!-- Ribbon Bow -->
      <circle cx="0" cy="-35" r="14" fill="#ffffff" />
      <circle cx="0" cy="-35" r="6" fill="#ea580c" />
    </g>

    <!-- Verified Delivery Badge -->
    <g transform="translate(-115, 65)">
      <circle cx="0" cy="0" r="28" fill="#057c56" stroke="#ffffff" stroke-width="2" />
      <!-- Checkmark -->
      <path d="M-10 0 L-3 8 L12 -8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- 5-Star Rating Row -->
  <g transform="translate(400, 560)">
    <g fill="#facc15" stroke="#ca8a04" stroke-width="1">
      <polygon points="0,-12 4,-3 13,-2 6,4 8,13 0,8 -8,13 -6,4 -13,-2 -4,-3" transform="translate(-70, 0) scale(1.4)" />
      <polygon points="0,-12 4,-3 13,-2 6,4 8,13 0,8 -8,13 -6,4 -13,-2 -4,-3" transform="translate(-35, 0) scale(1.4)" />
      <polygon points="0,-12 4,-3 13,-2 6,4 8,13 0,8 -8,13 -6,4 -13,-2 -4,-3" transform="translate(0, 0) scale(1.4)" />
      <polygon points="0,-12 4,-3 13,-2 6,4 8,13 0,8 -8,13 -6,4 -13,-2 -4,-3" transform="translate(35, 0) scale(1.4)" />
      <polygon points="0,-12 4,-3 13,-2 6,4 8,13 0,8 -8,13 -6,4 -13,-2 -4,-3" transform="translate(70, 0) scale(1.4)" />
    </g>
  </g>

  <!-- Primary Badge Header -->
  <g transform="translate(400, 630)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="rgba(255, 255, 255, 0.08)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="7" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#38bdf8" letter-spacing="3">
      SOLUTION SYSTEMS
    </text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="695" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="1">
    Happy Customer Delivery &amp; Store Showcase
  </text>

  <!-- Placeholder Note for user -->
  <text x="400" y="735" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="15" fill="#94a3b8" letter-spacing="0.5">
    • Replace with your custom store or customer photo anytime •
  </text>
</svg>
